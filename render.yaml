services:
  # ============================================
  # BhaiKiDukaan — Unified Free Tier Web Service
  # Runs API Gateway + 4 gRPC microservices
  # ============================================
  - type: web
    name: bhaikidukaan-api
    runtime: docker
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGINS
        value: '*'
      - key: USER_SERVICE_ADDRESS
        value: localhost:50051
      - key: PRODUCT_SERVICE_ADDRESS
        value: localhost:50052
      - key: ORDER_SERVICE_ADDRESS
        value: localhost:50053
      - key: PAYMENT_SERVICE_ADDRESS
        value: localhost:50054
      - key: DATABASE_URL
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
