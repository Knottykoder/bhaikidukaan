name: BhaiKiDukaan CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # 1. ESLint / Code Quality Check
  # ============================================
  eslint:
    name: 🎨 ESLint
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📡 Generate Protocol Buffers
        run: npm run proto:generate

      - name: 🔍 Run Linter
        run: npm run lint

  # ============================================
  # 2. TypeScript Type Safety Check
  # ============================================
  typescript:
    name: 🛡️ TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📡 Generate Protocol Buffers
        run: npm run proto:generate

      - name: 🔍 Run TypeScript Check
        run: npm run typecheck

  # ============================================
  # 3. Unit Tests & 70% Coverage Quality Gate
  # ============================================
  unit-tests:
    name: 🧪 Unit Tests (70% Coverage Gate)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📡 Generate Protocol Buffers
        run: npm run proto:generate

      - name: 🧪 Run Vitest & Validate 70% Coverage
        run: npm run test:coverage

  # ============================================
  # 4. Production Build Verification
  # ============================================
  build:
    name: 🏗️ Build
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📡 Generate Protocol Buffers
        run: npm run proto:generate

      - name: 🏗️ Production Build
        run: npm run build

  # ============================================
  # 5. Playwright End-to-End (E2E) Browser Tests
  # ============================================
  playwright-e2e:
    name: 🎭 Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 📡 Generate Protocol Buffers
        run: npm run proto:generate

      - name: 🌐 Install Playwright Chromium Browser
        run: npx playwright install --with-deps chromium

      - name: 🎭 Run Playwright E2E Tests
        run: npm run test:e2e
        env:
          CI: true

      - name: 📊 Upload Playwright Report (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # ============================================
  # 6. Unified PR Quality Gate (Required Status Check)
  # ============================================
  pr-quality-gate:
    name: 🚦 PR Quality Gate (Required for Merge)
    needs: [eslint, typescript, unit-tests, build, playwright-e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Evaluate All Required Quality Checks
        run: |
          echo "=========================================="
          echo "     PR QUALITY GATE EVALUATION           "
          echo "=========================================="
          echo "1. ESLint Check:      ${{ needs.eslint.result }}"
          echo "2. TypeScript Check:  ${{ needs.typescript.result }}"
          echo "3. Unit Tests Check:  ${{ needs.unit-tests.result }}"
          echo "4. Production Build:  ${{ needs.build.result }}"
          echo "5. Playwright E2E:    ${{ needs.playwright-e2e.result }}"
          echo "=========================================="

          if [ "${{ needs.eslint.result }}" != "success" ] || \
             [ "${{ needs.typescript.result }}" != "success" ] || \
             [ "${{ needs.unit-tests.result }}" != "success" ] || \
             [ "${{ needs.build.result }}" != "success" ] || \
             [ "${{ needs.playwright-e2e.result }}" != "success" ]; then
            echo "❌ ONE OR MORE CHECKS FAILED! MERGE IS BLOCKED AUTOMATICALLY."
            exit 1
          fi

          echo "✅ ALL REQUIRED CHECKS PASSED! MERGE IS ALLOWED."
          exit 0

  # ============================================
  # 7. Automated CD Deploy Trigger (Main Branch Only)
  # ============================================
  deploy:
    name: 🚀 Production Deploy
    needs: [pr-quality-gate]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Trigger Render Backend Deploy Webhook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render deployment webhook..."
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
          echo "✅ Deploy webhook triggered successfully!"

      - name: 🌐 Frontend Deployment Status
        run: |
          echo "✅ Vercel deploys the frontend automatically on git push to main!"
